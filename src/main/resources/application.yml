spring:
  application:
    name: task-manager-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskmanager}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

app:
  jwt:
    # Base64-encoded, at least 32 bytes. Generate one with: openssl rand -base64 48
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

management:
  endpoints:
    web:
      exposure:
        include: health
